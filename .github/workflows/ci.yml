name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-app:
    name: Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Check Firestore rules
        run: npm run check:rules

      - name: Typecheck TypeScript
        run: npx tsc --noEmit

      - name: Run unit tests
        run: npm run test

      - name: Build production app
        run: npm run build

  verify-functions:
    name: Verify Cloud Functions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install functions dependencies
        run: |
          cd functions
          npm install

      - name: Typecheck functions TypeScript
        run: |
          cd functions
          npx tsc --noEmit
